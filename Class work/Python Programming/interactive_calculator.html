<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Neomorphic & Glass Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-mono-calc {
      font-family: 'JetBrains Mono', monospace;
    }
    
    /* Subtle 3D button press physics */
    .calc-btn {
      transition: all 0.08s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      touch-action: manipulation;
    }
    .calc-btn:active, .calc-btn.active-key {
      transform: scale(0.94) translateY(2px);
      filter: brightness(1.2);
    }
    
    /* Custom scrollbar for calculation history */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.5);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 overflow-x-hidden selection:bg-indigo-500/30">

  <!-- Ambient background glow elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-cyan-600/20 rounded-full blur-3xl"></div>
  </div>

  <main class="relative z-10 w-full max-w-sm sm:max-w-md bg-slate-900/90 backdrop-blur-2xl rounded-3xl p-5 sm:p-6 shadow-2xl border border-slate-800/80 flex flex-col gap-4">
    
    <header class="flex items-center justify-between pb-1 border-b border-slate-800">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-rose-500/80"></div>
        <div class="w-3 h-3 rounded-full bg-amber-500/80"></div>
        <div class="w-3 h-3 rounded-full bg-emerald-500/80"></div>
        <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase ml-2">Calc Pro</span>
      </div>

      <div class="flex items-center gap-1">
        <!-- Sound Toggle -->
        <button id="soundToggle" title="Toggle Sound Feedback" class="p-2 text-slate-400 hover:text-indigo-400 hover:bg-slate-800/70 rounded-xl transition-all">
          <svg id="soundIconOn" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>
          </svg>
          <svg id="soundIconOff" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6m0-6l6 6"/>
          </svg>
        </button>

        <!-- History Drawer Toggle -->
        <button id="historyToggle" title="Toggle Calculation History" class="p-2 text-slate-400 hover:text-indigo-400 hover:bg-slate-800/70 rounded-xl transition-all flex items-center gap-1 text-xs">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </button>
      </div>
    </header>

    <section class="bg-slate-950/70 rounded-2xl p-4 sm:p-5 flex flex-col justify-end items-end h-28 border border-slate-800/60 shadow-inner relative overflow-hidden">
      <!-- Live Equation Preview -->
      <div id="equationDisplay" class="text-xs sm:text-sm text-slate-400 font-mono-calc tracking-wider h-5 overflow-hidden text-ellipsis whitespace-nowrap w-full text-right transition-opacity duration-150"></div>
      
      <!-- Primary Output -->
      <div id="primaryDisplay" class="text-3xl sm:text-4xl font-bold font-mono-calc tracking-tight text-white w-full text-right truncate transition-all duration-100">0</div>
      
      <!-- Notification toast within display -->
      <div id="displayBadge" class="absolute left-3 top-3 text-[10px] tracking-wider uppercase font-semibold text-slate-500 bg-slate-900/90 px-2 py-0.5 rounded-full border border-slate-800 opacity-0 transition-opacity pointer-events-none">Copied</div>
    </section>

    <div id="historyDrawer" class="hidden flex-col bg-slate-950/80 rounded-2xl p-4 border border-slate-800 text-sm max-h-48 transition-all">
      <div class="flex items-center justify-between pb-2 border-b border-slate-800/80 text-xs font-semibold text-slate-400">
        <span>Recent History</span>
        <button id="clearHistoryBtn" class="text-rose-400 hover:text-rose-300 hover:underline">Clear</button>
      </div>
      <div id="historyList" class="flex flex-col gap-2 pt-2 overflow-y-auto pr-1">
        <p class="text-slate-500 text-xs text-center py-4">No calculations recorded</p>
      </div>
    </div>

    <div class="grid grid-cols-4 gap-2.5 sm:gap-3 text-lg font-medium">
      <!-- Row 1 -->
      <button data-action="clear" class="calc-btn p-3 sm:p-4 rounded-2xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 border border-rose-500/20 active:bg-rose-500/30">AC</button>
      <button data-action="backspace" class="calc-btn p-3 sm:p-4 rounded-2xl bg-slate-800/70 hover:bg-slate-700/60 text-slate-300 border border-slate-700/30 flex items-center justify-center">
        <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6-7h12a2 2 0 012 2v10a2 2 0 01-2 2H9l-6-7z" />
        </svg>
      </button>
      <button data-action="percent" class="calc-btn p-3 sm:p-4 rounded-2xl bg-slate-800/70 hover:bg-slate-700/60 text-indigo-300 border border-slate-700/30">%</button>
      <button data-action="operator" data-value="/" class="calc-btn p-3 sm:p-4 rounded-2xl bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 font-bold">÷</button>

      <!-- Row 2 -->
      <button data-action="number" data-value="7" class="calc-btn p-3 sm:p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 text-white border border-slate-700/20 shadow-sm font-semibold">7</button>
      <button data-action="number" data-value="8" class="calc-btn p-3 sm:p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 text-white border border-slate-700/20 shadow-sm font-semibold">8</button>
      <button data-action="number" data-value="9" class="calc-btn p-3 sm:p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 text-white border border-slate-700/20 shadow-sm font-semibold">9</button>
      <button data-action="operator" data-value="*" class="calc-btn p-3 sm:p-4 rounded-2xl bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 font-bold">×</button>

      <!-- Row 3 -->
      <button data-action="number" data-value="4" class="calc-btn p-3 sm:p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 text-white border border-slate-700/20 shadow-sm font-semibold">4</button>
      <button data-action="number" data-value="5" class="calc-btn p-3 sm:p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 text-white border border-slate-700/20 shadow-sm font-semibold">5</button>
      <button data-action="number" data-value="6" class="calc-btn p-3 sm:p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 text-white border border-slate-700/20 shadow-sm font-semibold">6</button>
      <button data-action="operator" data-value="-" class="calc-btn p-3 sm:p-4 rounded-2xl bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 font-bold">−</button>

      <!-- Row 4 -->
      <button data-action="number" data-value="1" class="calc-btn p-3 sm:p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 text-white border border-slate-700/20 shadow-sm font-semibold">1</button>
      <button data-action="number" data-value="2" class="calc-btn p-3 sm:p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 text-white border border-slate-700/20 shadow-sm font-semibold">2</button>
      <button data-action="number" data-value="3" class="calc-btn p-3 sm:p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 text-white border border-slate-700/20 shadow-sm font-semibold">3</button>
      <button data-action="operator" data-value="+" class="calc-btn p-3 sm:p-4 rounded-2xl bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 font-bold">+</button>

      <!-- Row 5 -->
      <button data-action="negate" class="calc-btn p-3 sm:p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 text-slate-300 border border-slate-700/20 font-medium">±</button>
      <button data-action="number" data-value="0" class="calc-btn p-3 sm:p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 text-white border border-slate-700/20 shadow-sm font-semibold">0</button>
      <button data-action="decimal" class="calc-btn p-3 sm:p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 text-white border border-slate-700/20 shadow-sm font-bold">.</button>
      <button data-action="equals" class="calc-btn p-3 sm:p-4 rounded-2xl bg-indigo-500 hover:bg-indigo-400 text-white font-bold shadow-lg shadow-indigo-500/25 border border-indigo-400/40">=</button>
    </div>

    <!-- Quick keyboard hint footer -->
    <footer class="text-center text-[11px] text-slate-500 pt-1">
      Supports numpad & keyboard inputs (<kbd class="px-1 py-0.5 bg-slate-800 rounded text-slate-400 font-mono text-[10px]">Enter</kbd>, <kbd class="px-1 py-0.5 bg-slate-800 rounded text-slate-400 font-mono text-[10px]">Esc</kbd>)
    </footer>
  </main>

  <script>
    // Calculator core mathematical state
    const state = {
      currentValue: '0',
      previousValue: null,
      operator: null,
      awaitingNextOperand: false,
      history: []
    };

    // Tone.js tactile feedback synthesis
    let soundEnabled = true;
    let synth = null;

    function initAudio() {
      if (!synth && window.Tone) {
        synth = new Tone.MembraneSynth({
          pitchDecay: 0.008,
          octaves: 2,
          oscillator: { type: "sine" },
          envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.04 }
        }).toDestination();
        synth.volume.value = -12;
      }
    }

    function playHapticTone(type = 'default') {
      if (!soundEnabled) return;
      try {
        if (!synth) initAudio();
        if (Tone.context.state !== 'running') {
          Tone.start();
        }
        if (type === 'equals') {
          synth.triggerAttackRelease("C4", "16n");
        } else if (type === 'operator') {
          synth.triggerAttackRelease("G3", "32n");
        } else if (type === 'clear') {
          synth.triggerAttackRelease("E2", "32n");
        } else {
          synth.triggerAttackRelease("C3", "32n");
        }
      } catch (err) {
        // Gracefully ignore audio failures (e.g., autoplay policies)
      }
    }

    const primaryDisplay = document.getElementById('primaryDisplay');
    const equationDisplay = document.getElementById('equationDisplay');
    const historyDrawer = document.getElementById('historyDrawer');
    const historyList = document.getElementById('historyList');
    const displayBadge = document.getElementById('displayBadge');

    function formatNumber(numStr) {
      if (numStr === 'Error' || numStr === 'Infinity' || numStr === '-Infinity') return 'Error';
      const parts = numStr.split('.');
      parts[0] = Number(parts[0]).toLocaleString('en-US');
      return parts.join('.');
    }

    function updateDisplay() {
      primaryDisplay.textContent = formatNumber(state.currentValue);
      
      // Update equation sub-text
      if (state.operator && state.previousValue !== null) {
        const symbol = state.operator === '*' ? '×' : (state.operator === '/' ? '÷' : state.operator);
        equationDisplay.textContent = `${formatNumber(state.previousValue)} ${symbol}`;
      } else {
        equationDisplay.textContent = '';
      }
    }

    function showBadge(text = 'Copied') {
      displayBadge.textContent = text;
      displayBadge.classList.remove('opacity-0');
      setTimeout(() => {
        displayBadge.classList.add('opacity-0');
      }, 1200);
    }

    function inputDigit(digit) {
      if (state.currentValue === 'Error') {
        state.currentValue = digit;
        state.awaitingNextOperand = false;
        return;
      }
      
      if (state.awaitingNextOperand) {
        state.currentValue = digit;
        state.awaitingNextOperand = false;
      } else {
        state.currentValue = state.currentValue === '0' ? digit : state.currentValue + digit;
      }
      // Safety cap on digit count
      if (state.currentValue.length > 15) {
        state.currentValue = state.currentValue.slice(0, 15);
      }
    }

    function inputDecimal() {
      if (state.awaitingNextOperand) {
        state.currentValue = '0.';
        state.awaitingNextOperand = false;
        return;
      }
      if (!state.currentValue.includes('.')) {
        state.currentValue += '.';
      }
    }

    function clearAll() {
      state.currentValue = '0';
      state.previousValue = null;
      state.operator = null;
      state.awaitingNextOperand = false;
    }

    function backspace() {
      if (state.awaitingNextOperand || state.currentValue === 'Error') {
        state.currentValue = '0';
        return;
      }
      if (state.currentValue.length > 1) {
        state.currentValue = state.currentValue.slice(0, -1);
      } else {
        state.currentValue = '0';
      }
    }

    function negate() {
      if (state.currentValue === '0' || state.currentValue === 'Error') return;
      state.currentValue = (parseFloat(state.currentValue) * -1).toString();
    }

    function applyPercent() {
      if (state.currentValue === 'Error') return;
      const val = parseFloat(state.currentValue) / 100;
      state.currentValue = String(Number(val.toFixed(10)));
    }

    function compute(a, b, op) {
      const numA = parseFloat(a);
      const numB = parseFloat(b);
      let res = 0;
      switch (op) {
        case '+': res = numA + numB; break;
        case '-': res = numA - numB; break;
        case '*': res = numA * numB; break;
        case '/':
          if (numB === 0) return 'Error';
          res = numA / numB;
          break;
        default: return b;
      }
      // Round to prevent floating point inaccuracies like 0.1 + 0.2 = 0.30000000000000004
      return String(Number(res.toFixed(10)));
    }

    function handleOperator(nextOp) {
      const current = state.currentValue;

      if (state.operator && state.awaitingNextOperand) {
        state.operator = nextOp;
        return;
      }

      if (state.previousValue === null && current !== 'Error') {
        state.previousValue = current;
      } else if (state.operator) {
        const result = compute(state.previousValue, current, state.operator);
        if (result === 'Error') {
          state.currentValue = 'Error';
          state.previousValue = null;
          state.operator = null;
          state.awaitingNextOperand = false;
          return;
        }
        state.currentValue = result;
        state.previousValue = result;
      }

      state.awaitingNextOperand = true;
      state.operator = nextOp;
    }

    function evaluate() {
      if (!state.operator || state.previousValue === null) return;
      
      const prev = state.previousValue;
      const curr = state.currentValue;
      const op = state.operator;
      const result = compute(prev, curr, op);

      const opSymbol = op === '*' ? '×' : (op === '/' ? '÷' : op);
      const historyItem = `${formatNumber(prev)} ${opSymbol} ${formatNumber(curr)} = ${formatNumber(result)}`;
      
      addHistoryRecord(historyItem);

      state.currentValue = result;
      state.previousValue = null;
      state.operator = null;
      state.awaitingNextOperand = true;
    }

    function addHistoryRecord(record) {
      state.history.unshift(record);
      if (state.history.length > 20) state.history.pop();
      renderHistory();
    }

    function renderHistory() {
      if (state.history.length === 0) {
        historyList.innerHTML = `<p class="text-slate-500 text-xs text-center py-4">No calculations recorded</p>`;
        return;
      }

      historyList.innerHTML = state.history.map(item => `
        <div class="px-2.5 py-1.5 rounded-lg bg-slate-900/60 border border-slate-800/70 text-slate-300 font-mono-calc text-xs flex justify-between items-center hover:border-slate-700 transition-colors">
          <span>${item}</span>
        </div>
      `).join('');
    }

    document.querySelectorAll('.calc-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const action = btn.dataset.action;
        const val = btn.dataset.value;

        switch (action) {
          case 'number':
            playHapticTone('default');
            inputDigit(val);
            break;
          case 'decimal':
            playHapticTone('default');
            inputDecimal();
            break;
          case 'operator':
            playHapticTone('operator');
            handleOperator(val);
            break;
          case 'equals':
            playHapticTone('equals');
            evaluate();
            break;
          case 'clear':
            playHapticTone('clear');
            clearAll();
            break;
          case 'backspace':
            playHapticTone('default');
            backspace();
            break;
          case 'percent':
            playHapticTone('operator');
            applyPercent();
            break;
          case 'negate':
            playHapticTone('operator');
            negate();
            break;
        }
        updateDisplay();
      });
    });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      let matchedButton = null;

      if (e.key >= '0' && e.key <= '9') {
        inputDigit(e.key);
        matchedButton = document.querySelector(`[data-action="number"][data-value="${e.key}"]`);
        playHapticTone('default');
      } else if (e.key === '.') {
        inputDecimal();
        matchedButton = document.querySelector(`[data-action="decimal"]`);
        playHapticTone('default');
      } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
        handleOperator(e.key);
        matchedButton = document.querySelector(`[data-action="operator"][data-value="${e.key}"]`);
        playHapticTone('operator');
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        evaluate();
        matchedButton = document.querySelector(`[data-action="equals"]`);
        playHapticTone('equals');
      } else if (e.key === 'Backspace') {
        backspace();
        matchedButton = document.querySelector(`[data-action="backspace"]`);
        playHapticTone('default');
      } else if (e.key === 'Escape') {
        clearAll();
        matchedButton = document.querySelector(`[data-action="clear"]`);
        playHapticTone('clear');
      } else if (e.key === '%') {
        applyPercent();
        matchedButton = document.querySelector(`[data-action="percent"]`);
        playHapticTone('operator');
      }

      if (matchedButton) {
        matchedButton.classList.add('active-key');
        setTimeout(() => matchedButton.classList.remove('active-key'), 120);
      }
      updateDisplay();
    });

    // Toggle Sound Button
    const soundToggle = document.getElementById('soundToggle');
    const soundIconOn = document.getElementById('soundIconOn');
    const soundIconOff = document.getElementById('soundIconOff');

    soundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundIconOn.classList.toggle('hidden', !soundEnabled);
      soundIconOff.classList.toggle('hidden', soundEnabled);
      showBadge(soundEnabled ? 'Sound On' : 'Sound Muted');
    });

    // Toggle History Drawer
    const historyToggle = document.getElementById('historyToggle');
    historyToggle.addEventListener('click', () => {
      historyDrawer.classList.toggle('hidden');
      historyDrawer.classList.toggle('flex');
    });

    // Clear History Button
    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
      state.history = [];
      renderHistory();
      showBadge('History Cleared');
    });

    // Tap primary display to copy result
    primaryDisplay.parentElement.addEventListener('click', () => {
      if (state.currentValue !== 'Error') {
        const dummy = document.createElement('textarea');
        dummy.value = state.currentValue;
        document.body.appendChild(dummy);
        dummy.select();
        document.execCommand('copy');
        document.body.removeChild(dummy);
        showBadge('Copied!');
      }
    });

    // Initialize display state on load
    updateDisplay();
  </script>
</body>
</html>
